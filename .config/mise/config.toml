# Devtool pins and repo tasks for this overlay.  Host-specific knobs
# (core caps, -march) belong in the gitignored config.local.toml next
# to this file, never here.  See AGENTS.md for the test-run
# constraints.  Lives under .config/ because Portage rejects stray
# top-level files in an overlay.

[settings]
# Run the pipx backend through uv for fast, isolated installs.
pipx.uvx = true

[tools]
"pipx:pkgcheck" = "0.10.42"
"pipx:pkgdev" = "0.2.17"
# Keep in lockstep with the schema version hk.pkl amends.
hk = "2.4.0"
shellcheck = "0.11.0"
# Test env for sci-ml/strata's specs and smoke run, isolated from the
# system interpreter.  The --with pins follow upstream requirements.txt.
"pipx:pytest" = { version = "9.1.1", uvx_args = "--python 3.13 --with numpy==2.5.3 --with jinja2==3.1.6 --with regex==2026.9.10 --with pyyaml==6.0.3 --with tqdm==4.70.1 --with requests==2.34.2 --with pillow==12.3.0 --with psutil==7.2.2" }

[tasks.setup]
description = "Install the hk-managed git hooks (git config hook.* entries)"
run = "hk install"

[tasks.check]
description = "pkgcheck scan over the whole overlay (fails on error-class results)"
run = "pkgcheck scan --exit"

[tasks.manifest]
description = "Regenerate all manifests; fail if any Manifest changed or is untracked"
# git status --porcelain also catches a newly created, never-committed
# Manifest, which git diff alone cannot see.
run = [
	"pkgdev manifest --distdir .cache/agents/distfiles",
	"git status --porcelain -- '*/Manifest'",
	"test -z \"$(git status --porcelain -- '*/Manifest')\"",
]
