# Mojo configuration for Gentoo installs of dev-lang/mojo.
#
# The mojo driver resolves all of its tool and library paths relative
# to package_root (see Support/lib/Configuration.cpp and
# KGEN/lib/Support/Configuration.cpp upstream).  import_path is the
# search path for precompiled Mojo packages (std.mojoc, the standard
# library).
[mojo-max]
package_root = /usr/lib/mojo
import_path = /usr/lib/mojo/lib/mojo
