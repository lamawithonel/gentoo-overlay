# Example drop-in for a Hugging Face hub cache bind-mounted onto
# /var/lib/strata/huggingface/hub (README.gentoo.md covers the mount itself).
# RequiresMountsFor= adds Requires= and After= on that mount, so the server
# never starts on the empty directory below it.
#
# Keep /var/lib/strata owned by strata:strata.  StateDirectory=strata chowns
# the whole tree to strata whenever its top-level owner differs from User=,
# and that walk crosses into the bind mount and re-owns the other user's
# cache.  Grant strata access to that cache with ACLs instead.
[Unit]
RequiresMountsFor=/var/lib/strata/huggingface/hub
