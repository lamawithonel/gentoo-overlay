# Example drop-in for a Strata data dir outside /var/lib/strata, set up with
# `strata-setup --data-dir /srv/strata-data`.  ProtectSystem=strict leaves only
# the state directory writable, and the server writes packs there.  Install it
# as /etc/systemd/system/strata@.service.d/data-dir.conf (every instance) or
# under strata@<tag>.service.d/ (one), and label the directory for SELinux as
# README.gentoo.md describes.
[Service]
ReadWritePaths=/srv/strata-data
