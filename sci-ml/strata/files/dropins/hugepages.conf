# Example drop-in that reserves 2 MiB huge pages for the engine's expert
# arena while the instance runs and frees them when it stops.  Set
# STRATA_HUGEPAGES to the count in the engine's "MAP_HUGETLB unavailable
# (needed N 2 MiB pages ...)" journal line.  The "+" runs the helper as
# root outside the sandbox; the server keeps it.  Install it under
# strata@<tag>.service.d/ (the count is per model) and see
# README.gentoo.md for reserving the pages at boot instead.
[Service]
Environment=STRATA_HUGEPAGES=
ExecStartPre=+/usr/libexec/strata-hugepages reserve %i ${STRATA_HUGEPAGES}
ExecStopPost=+/usr/libexec/strata-hugepages release %i
