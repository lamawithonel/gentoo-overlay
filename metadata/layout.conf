repo-name = lamawithonel

profile-formats = portage-2 profile-set
masters = gentoo

eapis-deprecated = 5 6
eapis-banned = 0 1 2 3 4

sign-commits = false
sign-manifests = false

thin-manifests = true
use-manifests = strict
manifest-hashes = SHA3_512 BLAKE2B SHA512
manifest-required-hashes = BLAKE2B SHA512

# Gentoo's list plus network-sandbox, a Portage extension that lets
# an ebuild opt out of the build-time network sandbox (needed for
# Bazel-driven builds such as dev-lang/mojo).
restrict-allowed = binchecks bindist fetch installsources mirror network-sandbox preserve-libs splitdebug strip test userpriv
properties-allowed = interactive live test_network test_privileged
